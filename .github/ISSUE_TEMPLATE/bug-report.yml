name: バグ報告
description: XInputXFire の動作不良・不具合を報告する
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。事前に README の
        [トラブルシューティング](https://github.com/mayaqf/XInputXFire/blob/main/README.md#トラブルシューティング診断ログ) と
        [対応ゲームの条件](https://github.com/mayaqf/XInputXFire/blob/main/README.md#対応ゲームの条件) をご確認ください。

  - type: input
    id: game
    attributes:
      label: 対象ゲーム名
      placeholder: "例: 某14(dx11)"
    validations:
      required: true

  - type: dropdown
    id: dll
    attributes:
      label: 配置した XInput DLL 形態
      description: README の配置手順で選んだ形態
      options:
        - xinput1_3.dll (1.3 形態)
        - XInput9_1_0.dll (9.1.0 形態)
        - xinput1_4.dll (1.4 形態)
        - 不明
    validations:
      required: true

  - type: dropdown
    id: bit
    attributes:
      label: ゲームプロセスのビット
      options:
        - 64bit
        - 32bit
        - 不明
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "例: Windows 11 Home 26200"
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 診断ログ (%TEMP%\XInputXFire_xinput.log) の内容
      description: >
        ファイルを開いて内容をそのまま貼り付けてください。
        [STICKYINIT] 1行のみで後が続かない場合でも構いません。
        ログが無い場合は「ログ無し」と記載してください。
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の挙動
    validations:
      required: true