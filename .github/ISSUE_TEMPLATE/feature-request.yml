name: 機能要望
description: 新機能や改善の提案
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 要望の概要
      description: どのような機能・改善を望むかを簡潔に記載してください。
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 動機・ユースケース
      description: なぜその機能が必要か、どのような場面で使いたいかを記載してください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 既存の設定(ini)で代用できないか検討した内容があれば記載してください。
    validations:
      required: false