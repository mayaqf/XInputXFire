name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure & build (x64)
        run: |
          cmake -S . -B build-x64 -A x64
          cmake --build build-x64 --config Release
          ctest --test-dir build-x64 --build-config Release --output-on-failure

      - name: Configure & build (x86)
        run: |
          cmake -S . -B build-x86 -A Win32
          cmake --build build-x86 --config Release
          ctest --test-dir build-x86 --build-config Release --output-on-failure

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p staging
          cp build-x64/Release/xinput1_3_x64.dll   staging/
          cp build-x64/Release/XInput9_1_0_x64.dll staging/
          cp build-x86/Release/xinput1_3_x86.dll   staging/
          cp build-x86/Release/XInput9_1_0_x86.dll staging/
          cp assets/XInputXFire.ini                staging/
          ls -la staging

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: staging/*
          generate_release_notes: true