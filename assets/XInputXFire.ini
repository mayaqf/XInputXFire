; XInputXFire Proxy DLL 設定ファイル (v1.1.1)
; 対象ゲームのexeと同じフォルダに配置してください。
; ファイルが無い場合はデフォルト値(assets\XInputXFire.ini の値)が使用されます。
; XInputXFire Proxy DLL configuration file (v1.1.1)
; Place this file in the same folder as the target game's exe.
; If this file is missing, the default values (from assets\XInputXFire.ini) are used.

[XFire]
; 連射周期(ms)。ON区間=ボタン押下、OFF区間=ボタン離。
; Rapid fire cycle (ms). ON phase = button pressed, OFF phase = button released.
OnMs=50
OffMs=50
; 押下直後の最初のON区間だけの長さ(ms・0=無効=OnMsと同値)。
; 大きくすると連射ON中でも「1回だけボタンを押す」がコントロール可能。
; Length of the first ON phase right after the press (ms; 0 = disabled = same as OnMs).
; A larger value lets you fire "just one press" even while rapid fire is active.
FirstOnMs=200

; トリガ押下判定の閾値(0-255)。LT/RT がこの値以上で連射発動。
; Trigger press threshold (0-255). Rapid fire engages when LT/RT reaches this value.
TriggerThreshold=150
; 離上判定の閾値(0-255)。連射中はこの値未満で解除(ヒステリシス=チャタリング防止)。
; Release threshold (0-255). While firing, rapid fire stops below this value
; (hysteresis = prevents chattering).
HysteresisLow=140

; 連射対象ボタン(|区切り)。省略時は下記デフォルト。
; 対応名: DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT A B X Y LB RB START BACK LSB RSB
; Buttons subject to rapid fire (| separated). Defaults below if omitted.
; Accepted names: DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT A B X Y LB RB START BACK LSB RSB
TargetButtons=DPAD_UP|DPAD_DOWN|DPAD_LEFT|DPAD_RIGHT|A|B|X|Y

; LT/RT を連射発動トリガとして使用(1=有効 / 0=無効)
; Use LT/RT as rapid fire activation triggers (1 = enabled / 0 = disabled)
EnableLT=1
EnableRT=1

; ---- 連射マスタートグル ----
; 連射マスター有効/無効を切替えるコンボキー(|区切り)。この全キー同時押下の
; 立ち上がりで ON/OFF 切替。既定 LB+A(PS名 L1+A)。
; 対応名は TargetButtons と同じ。
; ---- Rapid fire master toggle ----
; Key combo that toggles the rapid fire master on/off (| separated). The toggle
; fires on the press of all listed keys together. Default LB+A (PS: L1+A).
; Accepted names are the same as TargetButtons.
ToggleButtons=LB|A
; 起動時のマスター状態(1=ON / 0=OFF)。
; Master state at startup (1 = ON / 0 = OFF).
DefaultEnabled=0
; トグル切替時の音声アナウンス(1=有効 / 0=無効)。
; Voice announcement on toggle (1 = enabled / 0 = disabled).
AnnounceEnabled=1

; ---- 起動音(プロキシロード完了の通知・DLL 埋め込み WAVE リソース再生) ----
; 起動時に「ポーン」音を鳴らす(1=再生 / 0=無効)。
; 音源は DLL に埋め込んだ WAVE リソース(src/proxy/startup.wav)。
; ---- Startup sound (notifies proxy load completion; plays a WAVE resource embedded in the DLL) ----
; Play the startup "ping" sound (1 = play / 0 = disabled). 
; The sound is a WAVE resource embedded in the DLL (src/proxy/startup.wav).
StartupSound=1

; ============================================================================
; [RapidFire] ボタン単独連射(トリガ不要)
; XFire マスター有効時、トリガ(LT/RT)を押さずボタンを押しっぱなしで連射する対象。
; 上記 [XFire] の FirstOnMs/OnMs/OffMs/TargetButtons とは別設定(独立した第2位相クロック)。
; 両リストに入っているボタンは「トリガ優先」で解決:
;   トリガ押下中 → トリガモード([XFire] の FirstOnMs/OnMs/OffMs)が駆動
;   トリガ非押下 → ボタン単独モード(下記)が駆動
; トリガリストのみのボタン → トリガ押下中のみ連射
; ボタン単独リストのみのボタン → トリガ状態に関わらず連射
; [RapidFire] Button-only rapid fire (no trigger required)
; When the XFire master is enabled, buttons held down (without LT/RT) that fire
; on their own.
; Separate settings from [XFire] FirstOnMs/OnMs/OffMs/TargetButtons above
; (an independent second phase clock).
; Buttons present in both lists are resolved with "trigger priority":
;   Trigger held   -> trigger mode drives ([XFire] FirstOnMs/OnMs/OffMs)
;   Trigger free   -> button-only mode (below) drives
; Button only in the trigger list   -> fires only while the trigger is held
; Button only in the button-only list -> fires regardless of trigger state
; ============================================================================
[RapidFire]
; 押下直後の最初のON区間だけの長さ(ms・0=無効=OnMsと同値)。
; 大きくすると連射ON中でも「1回だけボタンを押す」がコントロール可能。
; Length of the first ON phase right after the press (ms; 0 = disabled = same as OnMs).
; A larger value lets you fire "just one press" even while rapid fire is active.
FirstOnMs=500
; 連射周期(ms)。ON区間=ボタン押下、OFF区間=ボタン離。[XFire] とは独立。
; Rapid fire cycle (ms). ON phase = button pressed, OFF phase = button released.
; Independent from [XFire].
OnMs=50
OffMs=50
; 連射対象ボタン(|区切り)。[XFire] の TargetButtons とは別設定。対応名は同じ。
; 既定 A(決定ボタン連打用途)。
; Buttons subject to rapid fire (| separated). Separate from [XFire] TargetButtons.
; Accepted names are the same.
; Default A (for mashing the confirm button).
TargetButtons=A